<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Dry Run Indodax | Live</title>
<style>:root{--bg:#080D16;--card:#111B2B;--acc:#4F8CFF;--pos:#00D6A0;--neg:#FF5C75;--tx:#EAF0FA;--t2:#8A9BB5;--bd:#243249}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif;font-variant-numeric:tabular-nums}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:20px;margin:0}.sub{color:var(--t2);margin:2px 0 14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}.l{color:var(--t2);font-size:11px;text-transform:uppercase}.v{font-size:22px;font-weight:700}.pos{color:var(--pos)}.neg{color:var(--neg)}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--t2);font-size:11px;text-transform:uppercase}.tw{overflow:auto;max-height:380px}.bad{color:var(--neg);font-weight:700}</style></head>
<body><main><h1>Bot Dry Run Indodax — Live</h1><p class="sub" id="sub">memuat…</p><div class="grid" id="k"></div>
<div class="card"><div class="l">Equity harian (nilai pada best bid)</div><svg id="ch" viewBox="0 0 900 220" width="100%"></svg></div>
<div class="card tw"><div class="l">Posisi terbuka</div><table id="pos"></table></div>
<div class="card tw"><div class="l">Order simulasi</div><table id="ord"></table></div>
<div class="card tw"><div class="l">Error & kill switch</div><table id="err"></table></div>
<p class="sub">Dashboard lengkap (backtest vs forward, kecocokan sinyal) = <code>dashboard.html</code> hasil <code>hitung_ulang.py</code>, dihitung dari log mentah.</p></main>
<script>
const $=s=>document.querySelector(s),nf=(n,d=0)=>n==null||isNaN(n)?"—":Number(n).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d}),
ts=u=>u?new Date(u*1000).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",hour12:false})+" WIB":"—",esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
fetch("/api/status").then(r=>r.json()).then(D=>{const c=D.cfg,TF=c.tf_sec,W0=Date.parse(c.fwd_start)/1e3,W1=Date.parse(c.fwd_end)/1e3;
 const calls=D.calls.filter(x=>x.candle_ts+TF>W0&&x.candle_ts+TF<=W1),ok={};calls.forEach(x=>{if(x.status=="PROCESSED"&&x.processed_ts&&x.processed_ts<x.candle_ts+2*TF)ok[x.candle_ts]=1});
 const exp=Math.floor((W1-W0)/TF),n=Object.keys(ok).length,eq=D.equity.length?D.equity[D.equity.length-1].equity:null,last=D.calls.length?D.calls[D.calls.length-1]:null,e0=c.capital;
 $("#sub").textContent=`${c.strategy_name} · ${c.universe.join(", ")} · forward ${c.fwd_start} → ${c.fwd_end} · panggilan terakhir ${ts(last&&last.ts)}`;
 const k=(l,v,cl="")=>`<div class="card"><div class="l">${l}</div><div class="v ${cl}">${v}</div></div>`;
 const cur=last?last.equity:eq;
 $("#k").innerHTML=k("Equity terakhir","Rp"+nf(cur))+k("Return",cur?nf((cur/e0-1)*100,2)+"%":"—",cur>=e0?"pos":"neg")+k("Uptime",exp?nf(n/exp*100,1)+"% ("+n+"/"+exp+")":"—")+k("Panggilan",D.calls.length)+k("Order",D.orders.length)+k("Error",D.errors.length,D.errors.length?"neg":"pos")+k("Snapshot order book",D.snaps_n)+k("Kill switch",D.kill_flag?"AKTIF":"mati",D.kill_flag?"bad":"pos");
 const p=D.equity.map(x=>x.equity);if(p.length>1){let a=Math.min(...p),b=Math.max(...p);if(a==b){a-=1;b+=1}const X=i=>40+i/(p.length-1)*850,Y=v=>10+(1-(v-a)/(b-a))*190;$("#ch").innerHTML=`<path fill="none" stroke="#4F8CFF" stroke-width="2" d="${p.map((v,i)=>(i?"L":"M")+X(i)+","+Y(v)).join("")}"/><text x="4" y="14" fill="#8A9BB5" font-size="11">${nf(b)}</text><text x="4" y="205" fill="#8A9BB5" font-size="11">${nf(a)}</text>`}
 const P=Object.entries(D.state.pos||{});$("#pos").innerHTML="<tr><th>Pair</th><th>Qty</th><th>Harga masuk</th><th>Bid terakhir</th></tr>"+(P.map(([k,q])=>`<tr><td>${k}</td><td>${nf(q.qty,8)}</td><td>${nf(q.fill)}</td><td>${nf((D.state.last||{})[k])}</td></tr>`).join("")||'<tr><td colspan="4">Tidak ada posisi.</td></tr>');
 $("#ord").innerHTML="<tr><th>Waktu</th><th>Pair</th><th>Sisi</th><th>Qty</th><th>Bid</th><th>Ask</th><th>Fill</th><th>Fee</th></tr>"+(D.orders.slice().reverse().map(o=>`<tr><td>${ts(o.ts)}</td><td>${o.pair}</td><td>${o.side}</td><td>${nf(o.qty,8)}</td><td>${nf(o.best_bid)}</td><td>${nf(o.best_ask)}</td><td>${nf(o.fill)}</td><td>${nf(o.fee)}</td></tr>`).join("")||'<tr><td colspan="8">Belum ada order.</td></tr>');
 $("#err").innerHTML="<tr><th>Waktu</th><th>Jenis</th><th>Pesan</th></tr>"+(D.errors.concat(D.kill.map(x=>({ts:x.ts,type:"KILL",msg:x.action}))).sort((a,b)=>b.ts-a.ts).map(e=>`<tr><td>${ts(e.ts)}</td><td>${esc(e.type)}</td><td style="text-align:left">${esc(e.msg)}</td></tr>`).join("")||'<tr><td colspan="3">Tidak ada.</td></tr>')}).catch(e=>$("#sub").textContent="Gagal memuat /api/status: "+e);
</script></body></html>
